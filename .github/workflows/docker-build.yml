name: Build and Publish Docker Images

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: false
        type: string
        default: '0.0.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_GITHUB_TOKEN }}

      - name: Build and push main application image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.inputs.version || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migration image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.migration
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-migration:latest
            ghcr.io/${{ github.repository }}-migration:${{ github.event.inputs.version || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment summary
        run: |
          echo "🚀 Docker images built and pushed successfully!"
          echo "📦 Main app image: ghcr.io/${{ github.repository }}:${{ github.event.inputs.version || github.ref_name }}"
          echo "🔄 Migration image: ghcr.io/${{ github.repository }}-migration:${{ github.event.inputs.version || github.ref_name }}"
